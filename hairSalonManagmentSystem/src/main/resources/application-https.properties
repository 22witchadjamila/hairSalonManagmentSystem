# Run the app over HTTPS on localhost (chapter 9.4 / 9.7.3):
#   1. create a self-signed certificate once (see docs/SECURITY.md)
#   2. set SALON_SSL_KEYSTORE_PASSWORD, then start with the profile  https
# The browser will warn that the certificate is self-signed - expected for a local certificate.
server.port=${SALON_HTTPS_PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=${SALON_SSL_KEYSTORE:localhost-dev.p12}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${SALON_SSL_KEYSTORE_PASSWORD}
# Plain-HTTP port that just redirects to the HTTPS one above.
salon.http-redirect-port=${SALON_HTTP_PORT:8080}
# Over HTTPS the session cookie must never be sent in the clear.
server.servlet.session.cookie.secure=true
