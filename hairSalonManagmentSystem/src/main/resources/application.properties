spring.application.name=hairSalonManagementSystem

# MySQL is the default datasource. Set DB_USERNAME / DB_PASSWORD as environment
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:hair_salon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:salon_app}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update

# Flyway runs BEFORE Hibernate. The existing database predates Flyway, so the first run records
# it as baseline version 1 and then applies V2+ (see db/migration and docs/DATABASE_MIGRATIONS.md).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI docs, browsable at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs


# Sessions (chapter 9.7.4 / 9.7.5). The cookie is HttpOnly (page scripts can't read it) and SameSite=Lax
# (browsers don't send it on cross-site POSTs - a second layer behind the CSRF token). It is marked Secure
# automatically when the app runs over HTTPS (the "https" profile). An idle session ends after 30 minutes.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# "Remember me" signing key. Optional: leave it unset and a random key is made at startup (a restart then
# signs everyone out). Set the SALON_REMEMBER_ME_KEY environment variable to keep remembered sign-ins.
salon.remember-me.key=${SALON_REMEMBER_ME_KEY:}
