spring.application.name=hairSalonManagementSystem

# MySQL is the default datasource. Set DB_USERNAME / DB_PASSWORD as environment
# variables before running - never hardcode a real password here. DB_NAME
# defaults to hair_salon_db if not set.
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME:hair_salon_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:salon_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI docs, browsable at /swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# For quick offline work without MySQL running, start with:
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# (see application-h2.properties)
